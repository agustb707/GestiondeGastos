<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
</head>
<body>
    <h1>Categorías</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
        </tr>
        {% for c in categorias %}
        <tr>
            <td>{{ c.ID_Categoria }}</td>
            <td>{{ c.NombreCategoria }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
